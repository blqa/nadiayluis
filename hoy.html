<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var m=localStorage.getItem("nyl-tema");if(m)document.documentElement.dataset.theme=m}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pregunta del día · Nadia y Luis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,0..100,0..1;1,9..144,300..600,0..100,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css?v=20261108e">
  <style>
    .pregunta {
      position: relative;
      max-width: 44rem;
      padding: 2.25rem clamp(1.25rem, 5vw, 2.75rem);
      margin-bottom: 2.5rem;
      background: var(--noche);
      color: var(--estrella);
      border-radius: 28px;
      overflow: hidden;
    }
    .pregunta::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 12% 30%, #fff8 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 78% 22%, #fff9 50%, transparent 51%),
        radial-gradient(1px 1px at 88% 78%, #fff6 50%, transparent 51%),
        radial-gradient(1px 1px at 30% 84%, #fff5 50%, transparent 51%),
        radial-gradient(closest-side at 90% 0%, color-mix(in srgb, var(--cereza) 35%, transparent), transparent);
    }
    .pregunta small { position: relative; letter-spacing: .1em; text-transform: uppercase; font-size: .78rem; opacity: .75; }
    .pregunta h2 {
      position: relative; margin-top: .9rem;
      font-size: clamp(1.7rem, 5vw, 2.6rem); line-height: 1.18;
      font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 72;
      text-wrap: balance;
    }
    .racha {
      position: relative; display: inline-flex; align-items: center; gap: .45rem;
      margin-top: 1.5rem; font-size: .92rem;
      padding: .3rem .9rem; border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--estrella) 35%, transparent);
    }
    .racha[hidden] { display: none; }

    #contenido { max-width: 44rem; }
    .responder { display: grid; gap: .75rem; }
    .responder .fila { display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .responder small { color: var(--tinta-suave); }
    .espera { font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--tinta-suave); margin: 1rem 0 0; }

    .respuestas { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
    .respuesta { display: grid; gap: .6rem; align-content: start; }
    .respuesta h3 { font-family: var(--sans); font-size: .8rem; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--cereza); }
    .respuesta p { font-family: var(--serif); font-size: 1.2rem; line-height: 1.5; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .respuesta button { justify-self: start; font: inherit; font-size: .85rem; background: none; border: 0; padding: 0; color: var(--tinta-suave); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .respuesta button:hover { color: var(--cereza); }

    .antes { margin-top: 3.5rem; }
    .antes h2 { font-size: 1.8rem; margin-bottom: 1rem; }
    .antes details { border-top: 1px solid var(--polvo); padding: 1rem 0; }
    .antes details:last-child { border-bottom: 1px solid var(--polvo); }
    .antes summary { cursor: pointer; font-family: var(--serif); font-size: 1.15rem; list-style: none; display: grid; gap: .2rem; }
    .antes summary::-webkit-details-marker { display: none; }
    .antes summary small { color: var(--tinta-suave); font-family: var(--sans); font-size: .82rem; }
    .antes details[open] summary { margin-bottom: 1rem; color: var(--cereza); }
    .antes .respuestas { margin-top: .5rem; }
    .vacio { color: var(--tinta-suave); font-family: var(--serif); font-style: italic; }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado-pagina">
      <h1>Pregunta del día</h1>
      <p>Una pregunta nueva cada día, igual para los dos. Las respuestas se muestran cuando las dos hayamos contestado.</p>
    </header>

    <section class="pregunta" aria-labelledby="la-pregunta" data-revela>
      <small id="fecha-pregunta"></small>
      <h2 id="la-pregunta">…</h2>
      <div class="racha" id="racha" hidden></div>
    </section>

    <div id="acceso"></div>

    <div id="contenido" hidden>
      <section id="hoy" aria-live="polite"></section>
      <section class="antes" id="antes" hidden>
        <h2>Lo que ya nos contestamos</h2>
        <div id="antes-lista"></div>
      </section>
    </div>
  </main>

  <script src="assets/js/datos.js?v=20261108e"></script>
  <script src="assets/js/site.js?v=20261108e"></script>
  <script src="assets/js/nube.js?v=20261108e"></script>
  <script>
    /* La pregunta es la misma para los dos porque sale de la fecha */
    const hoyId = Nube.hoyId();
    function preguntaDe(id) {
      const [a, m, d] = id.split("-").map(Number);
      const dia = Math.floor(Date.UTC(a, m - 1, d) / DIA);
      return DATOS.preguntas[dia % DATOS.preguntas.length];
    }
    function fechaLarga(id) {
      const [a, m, d] = id.split("-").map(Number);
      const f = new Date(a, m - 1, d);
      return `${DIA_SEM[f.getDay()]} ${d} de ${MESES[m - 1]}`;
    }
    const DIA_SEM = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

    document.getElementById("fecha-pregunta").textContent = `Hoy · ${fechaLarga(hoyId)}`;
    document.getElementById("la-pregunta").textContent = preguntaDe(hoyId);

    let bajas = [], estuvo = false;
    Nube.acceso(document.getElementById("acceso"), {
      titulo: "Entra para contestar",
      texto: "La pregunta es pública, pero las respuestas son solo para los dos.",
      alListo: arrancar,
      alSalir: () => { bajas.forEach(f => f()); bajas = []; if (estuvo) location.reload(); },
    });

    function arrancar(yo, N) {
      estuvo = true;
      const { db, F } = N;
      const otro = Nube.otroNombre;
      document.getElementById("contenido").hidden = false;
      const hoyBloque = document.getElementById("hoy");
      let editando = false, bothAntes = null;

      /* dia → { uid: {nombre, texto, creado} } */
      function agrupar(docs) {
        const dias = {};
        docs.forEach(d => { const x = d.data(); (dias[x.dia] ||= {})[x.uid] = x; });
        return dias;
      }

      function tarjeta(titulo, texto, extra = "") {
        return `<article class="tarjeta respuesta"><h3>${limpio(titulo)}</h3><p>${limpio(texto)}</p>${extra}</article>`;
      }

      function pintarHoy(dias) {
        const hoy = dias[hoyId] || {};
        const mia = hoy[yo.uid];
        const suya = Object.values(hoy).find(x => x.uid !== yo.uid);
        const ambas = !!(mia && suya);

        if (!mia || editando) {
          hoyBloque.innerHTML = `<form class="responder" id="form-respuesta">
            <label for="resp" style="font-family:var(--serif);font-size:1.25rem">Tu respuesta</label>
            <textarea class="campo" id="resp" maxlength="1200" placeholder="Escribe lo primero que sientas…" required>${limpio(mia ? mia.texto : "")}</textarea>
            <div class="fila">
              <small>${suya && !mia ? `${limpio(otro)} ya contestó. Escribe la tuya para ver la suya.` : "Se muestran las dos cuando las dos hayamos contestado."}</small>
              <button class="boton" type="submit">Guardar mi respuesta</button>
            </div></form>`;
          const form = hoyBloque.querySelector("#form-respuesta");
          form.addEventListener("submit", async e => {
            e.preventDefault();
            const texto = form.resp.value.trim();
            if (!texto) return;
            form.querySelector("button").disabled = true;
            try {
              await F.setDoc(F.doc(db, "respuestas", `${hoyId}_${yo.uid}`), { uid: yo.uid, nombre: yo.nombre, dia: hoyId, texto, creado: F.serverTimestamp() });
              editando = false;
            } catch (err) { Nube.toast(Nube.mensaje(err)); form.querySelector("button").disabled = false; }
          });
          return;
        }

        const botonEditar = '<button type="button" data-editar>Editar</button>';
        if (ambas) {
          hoyBloque.innerHTML = `<div class="respuestas">${tarjeta("Tú", mia.texto, botonEditar)}${tarjeta(suya.nombre || otro, suya.texto)}</div>`;
          if (bothAntes === false) { Nube.toast("¡Ya contestamos las dos!"); if (window.lluvia) window.lluvia(10); }
        } else {
          hoyBloque.innerHTML = `<div class="respuestas">${tarjeta("Tu respuesta", mia.texto, botonEditar)}</div>
            <p class="espera">Esperando a que ${limpio(otro)} conteste…</p>`;
        }
        bothAntes = ambas;
        const be = hoyBloque.querySelector("[data-editar]");
        if (be) be.addEventListener("click", () => { editando = true; pintarHoy(dias); });
      }

      function pintarRacha(dias) {
        const completo = id => dias[id] && Object.keys(dias[id]).length >= 2;
        let d = new Date(); d.setHours(12, 0, 0, 0);
        if (!completo(Nube.hoyId(d))) d.setDate(d.getDate() - 1);
        let n = 0;
        while (completo(Nube.hoyId(d))) { n++; d.setDate(d.getDate() - 1); }
        const el = document.getElementById("racha");
        el.hidden = n === 0;
        if (n) el.textContent = `🔥 ${n} ${n === 1 ? "día seguido" : "días seguidos"} contestando las dos`;
      }

      function pintarAntes(dias) {
        const ids = Object.keys(dias).filter(id => id !== hoyId && Object.keys(dias[id]).length >= 2).sort().reverse().slice(0, 40);
        const sec = document.getElementById("antes");
        sec.hidden = !ids.length;
        document.getElementById("antes-lista").innerHTML = ids.map(id => {
          const r = Object.values(dias[id]).sort((a, b) => (b.uid === yo.uid) - (a.uid === yo.uid));
          return `<details><summary>${limpio(preguntaDe(id))}<small>${limpio(fechaLarga(id))}</small></summary>
            <div class="respuestas">${r.map(x => tarjeta(x.uid === yo.uid ? "Tú" : x.nombre || otro, x.texto)).join("")}</div></details>`;
        }).join("");
      }

      const consulta = F.query(F.collection(db, "respuestas"), F.orderBy("dia", "desc"), F.limit(200));
      bajas.push(F.onSnapshot(consulta, snap => {
        const dias = agrupar(snap.docs);
        const hoy = dias[hoyId] || {};
        if (bothAntes === null) bothAntes = !!(hoy[yo.uid] && Object.values(hoy).some(x => x.uid !== yo.uid));
        pintarHoy(dias);
        pintarRacha(dias);
        pintarAntes(dias);
      }, err => {
        hoyBloque.innerHTML = `<p class="vacio">${limpio(Nube.mensaje(err))}</p>`;
      }));
    }
  </script>
</body>
</html>
