<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lo que amo de ti · Nadia y Luis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,0..100,0..1;1,9..144,300..600,0..100,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css?v=20261108c">
  <style>
    .una {
      max-width: 44rem;
      min-height: 15rem;
      padding: 2.25rem 2rem;
      background: #FFFDFB;
      border-radius: 4px;
      box-shadow: 0 1px 2px #2b183014, 0 16px 40px -24px #2b183059;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.5rem;
    }
    .una .num { font-family: var(--serif); font-style: italic; color: var(--cereza); }
    .una h2 { font-size: clamp(2rem, 6vw, 3.25rem); font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; }
    .una p { font-family: var(--serif); font-size: 1.2rem; line-height: 1.6; margin: .75rem 0 0; font-variation-settings: "SOFT" 100, "opsz" 24; }
    .una .boton { align-self: flex-start; }

    .todas { margin-top: 5rem; }
    .todas h2 { font-size: clamp(1.8rem, 5vw, 2.5rem); }
    .todas .buscar { margin-top: 1.25rem; max-width: 24rem; }
    .todas input {
      width: 100%;
      font: inherit;
      padding: .7rem 1rem;
      border: 1.5px solid var(--polvo);
      border-radius: 999px;
      background: #FFFDFB;
      color: var(--tinta);
    }
    .todas input:focus { border-color: var(--cereza); outline: none; }
    .razones { list-style: none; margin: 2rem 0 0; padding: 0; columns: 2 22rem; column-gap: 3rem; }
    .razones li { break-inside: avoid; padding: 1rem 0; border-top: 1px solid var(--polvo); display: grid; grid-template-columns: 2.5rem 1fr; gap: 0 .5rem; }
    .razones .n { font-family: var(--serif); font-style: italic; color: var(--cereza); }
    .razones strong { font-family: var(--serif); font-weight: 400; font-size: 1.25rem; line-height: 1.2; }
    .razones p { grid-column: 2; margin: .25rem 0 0; color: var(--tinta-suave); font-size: .98rem; line-height: 1.55; }
    .vacio { color: var(--tinta-suave); margin-top: 2rem; }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado-pagina">
      <h1>Lo que amo de ti</h1>
      <p>Cien razones. Aquí van todas, y una al azar cuando quieras.</p>
    </header>

    <section class="una" aria-live="polite">
      <div>
        <span class="num" id="una-num"></span>
        <h2 id="una-titulo"></h2>
        <p id="una-texto"></p>
      </div>
      <button class="boton claro" id="otra" type="button">Otra razón</button>
    </section>

    <section class="todas">
      <h2>Las cien</h2>
      <div class="buscar">
        <label for="buscar" class="visualmente-oculto" style="position:absolute;left:-9999px">Buscar una razón</label>
        <input id="buscar" type="search" placeholder="Buscar: ojitos, Huasca, abrazos…">
      </div>
      <ul class="razones" id="razones"></ul>
      <p class="vacio" id="vacio" hidden>Ninguna razón coincide. Prueba con otra palabra.</p>
    </section>
  </main>

  <script src="assets/js/datos.js?v=20261108c"></script>
  <script src="assets/js/site.js?v=20261108c"></script>
  <script>
    const R = DATOS.razones;
    let ultima = -1;
    function mostrar(i) {
      ultima = i;
      document.getElementById("una-num").textContent = `Razón ${i + 1} de ${R.length}`;
      document.getElementById("una-titulo").textContent = R[i].titulo;
      document.getElementById("una-texto").textContent = R[i].texto;
    }
    function otra() {
      let i; do { i = Math.floor(Math.random() * R.length); } while (i === ultima && R.length > 1);
      mostrar(i);
    }
    // La razón de hoy cambia cada día
    const hoy = new Date();
    mostrar((hoy.getFullYear() * 366 + hoy.getMonth() * 31 + hoy.getDate()) % R.length);
    document.getElementById("otra").addEventListener("click", otra);

    const lista = document.getElementById("razones");
    lista.innerHTML = R.map((r, i) => `
      <li data-t="${limpio((r.titulo + " " + r.texto).toLowerCase())}">
        <span class="n">${i + 1}</span><strong>${limpio(r.titulo)}</strong><p>${limpio(r.texto)}</p>
      </li>`).join("");
    document.getElementById("buscar").addEventListener("input", e => {
      const q = e.target.value.trim().toLowerCase();
      let hay = 0;
      lista.querySelectorAll("li").forEach(li => { const ok = !q || li.dataset.t.includes(q); li.hidden = !ok; if (ok) hay++; });
      document.getElementById("vacio").hidden = hay > 0;
    });
  </script>
</body>
</html>
