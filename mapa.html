<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var m=localStorage.getItem("nyl-tema");if(m)document.documentElement.dataset.theme=m}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuestro mapa · Nadia y Luis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,0..100,0..1;1,9..144,300..600,0..100,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="assets/css/site.css?v=20261108e">
  <style>
    .resumen { font-family: var(--serif); font-size: 1.25rem; margin: 0 0 1.5rem; }
    .resumen strong { color: var(--cereza); font-weight: 500; }

    #mapa {
      height: min(68vh, 40rem); min-height: 22rem;
      border-radius: 24px;
      border: 1px solid var(--polvo);
      background: var(--papel-2);
      overflow: hidden;
      box-shadow: 0 30px 60px -40px color-mix(in srgb, var(--cereza) 55%, transparent);
      position: relative; z-index: 0;
    }
    #mapa .aviso-mapa { position: absolute; inset: 0; display: grid; place-items: center; padding: 2rem; text-align: center; color: var(--tinta-suave); font-family: var(--serif); font-size: 1.15rem; }

    /* El mapa se pone oscuro y rosado junto con la página */
    .leaflet-tile-pane { filter: saturate(.75) sepia(.12) hue-rotate(-12deg); }
    :root[data-modo="oscuro"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.88) contrast(.92) saturate(.55); }
    .leaflet-container { font-family: var(--sans); background: var(--papel-2); }
    .leaflet-popup-content-wrapper { background: var(--hoja); color: var(--tinta); border-radius: 16px; box-shadow: 0 20px 40px -18px #2b183090; }
    .leaflet-popup-tip { background: var(--hoja); }
    .leaflet-popup-content { margin: 1rem 1.15rem; line-height: 1.45; }
    .leaflet-container a.leaflet-popup-close-button { color: var(--tinta-suave); }
    .leaflet-control-zoom a { background: var(--hoja); color: var(--tinta); border-color: var(--polvo); }
    .leaflet-control-attribution { background: color-mix(in srgb, var(--papel) 80%, transparent) !important; color: var(--tinta-suave); font-size: 10px; }
    .leaflet-control-attribution a { color: var(--tinta-suave); }

    .pop h3 { font-size: 1.25rem; margin-bottom: .5rem; }
    .pop p { margin: .15rem 0; font-size: .92rem; color: var(--tinta-suave); }
    .pop p strong { color: var(--tinta); font-weight: 500; }
    .pop img { width: 12rem; max-width: 100%; border-radius: 10px; margin: .6rem 0 .1rem; }
    .pop a { color: var(--cereza); font-size: .9rem; }

    .corazon-mapa { background: none; border: 0; }
    .corazon-mapa svg { width: 34px; height: 34px; color: var(--cereza); filter: drop-shadow(0 4px 6px #2b183066); transition: transform .2s; transform-origin: 50% 90%; }
    .corazon-mapa:hover svg { transform: scale(1.18); }
    .corazon-mapa.ultimo svg { animation: latido-mapa 2.2s ease-in-out infinite; }
    @keyframes latido-mapa { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.22); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }

    .sitios { list-style: none; margin: 3rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 1rem; counter-reset: sitio; }
    .sitios li { counter-increment: sitio; }
    .sitios button {
      all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
      display: grid; grid-template-columns: 2.2rem 1fr; gap: .2rem .75rem;
    }
    .sitios button:focus-visible { outline: 2px solid var(--cereza); outline-offset: 4px; border-radius: 12px; }
    .sitios button::before { content: counter(sitio); grid-row: 1 / 3; font-family: var(--serif); font-style: italic; font-size: 1.7rem; line-height: 1; color: var(--cereza); }
    .sitios strong { font-family: var(--serif); font-weight: 400; font-size: 1.2rem; line-height: 1.2; }
    .sitios span { color: var(--tinta-suave); font-size: .9rem; }
    .sitios em { font-style: normal; color: var(--tinta-suave); font-size: .9rem; }
    .nota-mapa { color: var(--tinta-suave); font-size: .9rem; margin-top: 2rem; max-width: 40rem; }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado-pagina">
      <h1>Nuestro mapa</h1>
      <p>Los lugares donde hemos estado juntos, unidos por el hilo de nuestra historia.</p>
    </header>

    <p class="resumen" id="resumen"></p>
    <div id="mapa" role="region" aria-label="Mapa con los lugares donde hemos estado"></div>
    <ol class="sitios" id="sitios"></ol>
    <p class="nota-mapa">Los puntos del mapa son aproximados: marcan el lugar o la zona, no el sitio exacto.</p>
  </main>

  <script src="assets/js/datos.js?v=20261108e"></script>
  <script src="assets/js/site.js?v=20261108e"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    /* Juntamos los momentos que tienen  lugar  y que caen en el mismo punto */
    const sitios = [];
    DATOS.historia.filter(h => h.lugar).forEach(h => {
      const [lat, lng, nombre] = h.lugar;
      let s = sitios.find(x => x.lat === lat && x.lng === lng);
      if (!s) { s = { lat, lng, nombre, momentos: [] }; sitios.push(s); }
      s.momentos.push(h);
    });

    const visitas = DATOS.historia.filter(h => h.lugar).length;
    document.getElementById("resumen").innerHTML =
      `<strong>${sitios.length}</strong> lugares y <strong>${visitas}</strong> ${visitas === 1 ? "visita" : "visitas"} guardadas en nuestra historia.`;

    const primeraFoto = h => Array.isArray(h.foto) ? h.foto[0] : h.foto;
    const contenidoPop = s => `<div class="pop"><h3>${limpio(s.nombre)}</h3>
      ${s.momentos.map(m => `<p><strong>${limpio(m.titulo)}</strong><br>${limpio(m.fecha)}</p>`).join("")}
      ${primeraFoto(s.momentos[0]) ? `<img src="${limpio(primeraFoto(s.momentos[0]))}" alt="" loading="lazy">` : ""}
      <p><a href="historia.html">Ver en la historia →</a></p></div>`;

    document.getElementById("sitios").innerHTML = sitios.map((s, i) => `
      <li class="tarjeta" data-revela style="--i:${i % 4}"><button type="button" data-i="${i}">
        <strong>${limpio(s.nombre)}</strong>
        <span>${limpio(s.momentos.map(m => m.titulo).join(" · "))}</span>
      </button></li>`).join("");
    revelar(document.getElementById("sitios"));

    /* El mapa (si Leaflet no cargó, queda la lista de arriba y abajo) */
    const contenedor = document.getElementById("mapa");
    const marcadores = [];
    if (typeof L === "undefined" || !sitios.length) {
      contenedor.innerHTML = '<div class="aviso-mapa">El mapa no pudo cargar ahora mismo. Aquí abajo están los lugares.</div>';
    } else {
      const mapa = L.map(contenedor, { scrollWheelZoom: false, zoomControl: true });
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" rel="noopener">OpenStreetMap</a>',
      }).addTo(mapa);

      const corazon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6 5c2.1 0 3.6 1.2 4.5 2.6h3C14.4 6.2 15.9 5 18 5c3.3 0 5.1 3.4 3.6 6.8C19.5 16.4 12 21 12 21Z" stroke="#fff" stroke-width="1.2"/></svg>';
      const puntos = sitios.map(s => [s.lat, s.lng]);
      L.polyline(puntos, { color: getComputedStyle(document.documentElement).getPropertyValue("--cereza").trim() || "#B4234F", weight: 2.5, opacity: .7, dashArray: "2 9", lineCap: "round" }).addTo(mapa);

      sitios.forEach((s, i) => {
        const icono = L.divIcon({ className: "corazon-mapa" + (i === sitios.length - 1 ? " ultimo" : ""), html: corazon, iconSize: [34, 34], iconAnchor: [17, 30], popupAnchor: [0, -26] });
        const m = L.marker([s.lat, s.lng], { icon: icono, title: s.nombre, keyboard: true }).addTo(mapa).bindPopup(contenidoPop(s), { maxWidth: 260 });
        marcadores.push(m);
      });
      mapa.fitBounds(L.latLngBounds(puntos).pad(0.2), { maxZoom: 9 });

      /* La rueda del ratón solo mueve el mapa cuando lo tocas (para no atorar el scroll) */
      mapa.on("click focus", () => mapa.scrollWheelZoom.enable());
      mapa.on("mouseout blur", () => mapa.scrollWheelZoom.disable());

      document.getElementById("sitios").addEventListener("click", e => {
        const b = e.target.closest("[data-i]");
        if (!b) return;
        const i = Number(b.dataset.i);
        contenedor.scrollIntoView({ behavior: "smooth", block: "center" });
        mapa.flyTo([sitios[i].lat, sitios[i].lng], 11, { duration: 1.2 });
        setTimeout(() => marcadores[i].openPopup(), 1300);
      });
    }
  </script>
</body>
</html>
