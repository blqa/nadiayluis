<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var m=localStorage.getItem("nyl-tema");if(m)document.documentElement.dataset.theme=m}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lo que soñamos · Nadia y Luis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,0..100,0..1;1,9..144,300..600,0..100,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css?v=20261108e">
  <style>
    .progreso { font-family: var(--serif); font-size: 1.25rem; margin: 0 0 2rem; }
    .progreso strong { color: var(--cereza); font-weight: 500; }

    .suenos { list-style: none; padding: 0; margin: 0; max-width: 44rem; border-top: 1px solid var(--polvo); }
    .suenos li { border-bottom: 1px solid var(--polvo); }
    .suenos label {
      display: grid;
      grid-template-columns: 2rem 1fr;
      gap: 1rem;
      align-items: start;
      padding: 1.2rem 0;
      cursor: pointer;
    }
    .suenos input { position: absolute; opacity: 0; pointer-events: none; }
    .casilla {
      width: 1.75rem; height: 1.75rem;
      border-radius: 50%;
      border: 1.5px solid var(--tinta-suave);
      display: grid;
      place-items: center;
      margin-top: .15rem;
      transition: background .2s, border-color .2s;
    }
    .casilla svg { width: 1rem; opacity: 0; transform: scale(.5); transition: opacity .2s, transform .25s cubic-bezier(.3,1.6,.5,1); color: #fff; }
    .suenos input:focus-visible + .casilla { outline: 2px solid var(--cereza); outline-offset: 3px; }
    .suenos input:checked + .casilla { background: var(--cereza); border-color: var(--cereza); }
    .suenos input:checked + .casilla svg { opacity: 1; transform: scale(1); }
    .suenos .texto-sueno {
      font-family: var(--serif);
      font-size: clamp(1.25rem, 3.5vw, 1.55rem);
      line-height: 1.3;
      font-variation-settings: "SOFT" 100, "opsz" 36;
      transition: color .2s;
    }
    .suenos input:checked ~ .texto-sueno {
      color: var(--tinta-suave);
      text-decoration: line-through;
      text-decoration-color: var(--cereza);
      text-decoration-thickness: 1.5px;
    }

    form.nuevo { display: flex; gap: .75rem; margin-top: 2.5rem; max-width: 44rem; flex-wrap: wrap; }
    form.nuevo label { flex-basis: 100%; font-family: var(--serif); font-size: 1.15rem; }
    form.nuevo input {
      flex: 1 1 14rem;
      font: inherit;
      padding: .75rem 1rem;
      border: 1.5px solid var(--polvo);
      border-radius: 999px;
      background: var(--hoja);
      color: var(--tinta);
    }
    form.nuevo input:focus { border-color: var(--cereza); outline: none; }
    .nota { color: var(--tinta-suave); font-size: .92rem; margin-top: 1rem; }

    .compartir { max-width: 44rem; margin-top: 2.5rem; border-top: 1px solid var(--polvo); padding-top: 1.5rem; }
    .compartir summary { cursor: pointer; font-family: var(--serif); font-size: 1.25rem; list-style: none; display: flex; align-items: center; gap: .6rem; }
    .compartir summary::-webkit-details-marker { display: none; }
    .compartir summary::after { content: "+"; color: var(--cereza); font-size: 1.5rem; line-height: 1; transition: transform .25s; }
    .compartir[open] summary::after { transform: rotate(45deg); }
    .compartir .contenido-compartir { padding-top: 1.25rem; }
    .compartir .sincro { color: var(--tinta-suave); font-size: .92rem; margin: 0; }
    .compartir .sincro::before { content: ""; display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: var(--cereza); margin-right: .5rem; animation: latido-suave 2.4s ease-in-out infinite; }
    @keyframes latido-suave { 50% { opacity: .3; } }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado-pagina">
      <h1>Lo que soñamos</h1>
      <p>Todo lo que nos falta por hacer juntos. Tócalo cuando lo cumplamos.</p>
    </header>

    <p class="progreso" id="progreso"></p>
    <ul class="suenos" id="suenos"></ul>

    <form class="nuevo" id="nuevo">
      <label for="nuevo-texto">Agregar un sueño</label>
      <input id="nuevo-texto" type="text" maxlength="120" placeholder="Por ejemplo: ir a un concierto juntos" required>
      <button class="boton" type="submit">Agregar</button>
    </form>
    <p class="nota" id="nota-guardado">Lo que palomees o agregues aquí se guarda en este teléfono.</p>

    <details class="compartir" id="compartir">
      <summary>Compartir esta lista entre los dos</summary>
      <div class="contenido-compartir">
        <div id="acceso"></div>
        <p class="sincro" id="sincro" hidden>La lista está sincronizada: lo que marque la otra persona lo ves aquí al instante.</p>
      </div>
    </details>
  </main>

  <script src="assets/js/datos.js?v=20261108e"></script>
  <script src="assets/js/site.js?v=20261108e"></script>
  <script>
    const LLAVE = "nyl-suenos";
    const leer = () => { try { return JSON.parse(localStorage.getItem(LLAVE)) || {}; } catch { return {}; } };
    const guardar = g => { try { localStorage.setItem(LLAVE, JSON.stringify(g)); } catch {} };

    function pintar() {
      const g = leer();
      const extra = g.extra || [];
      const marcas = g.marcas || {};
      const todos = [...DATOS.suenos, ...extra.map(texto => ({ texto, hecho: false }))];
      const lista = document.getElementById("suenos");
      lista.innerHTML = todos.map((s, i) => {
        const hecho = s.texto in marcas ? marcas[s.texto] : s.hecho;
        return `<li><label>
          <input type="checkbox" data-texto="${limpio(s.texto)}" ${hecho ? "checked" : ""}>
          <span class="casilla" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
          <span class="texto-sueno">${limpio(s.texto)}</span>
        </label></li>`;
      }).join("");
      contar();
    }

    function contar() {
      const cajas = [...document.querySelectorAll("#suenos input")];
      const hechos = cajas.filter(c => c.checked).length;
      document.getElementById("progreso").innerHTML =
        `Llevamos <strong>${hechos}</strong> de ${cajas.length} cumplidos.`;
    }

    /* --- Compartida entre los dos (Firebase) --- */
    let nube = null; // { ref, F } cuando la lista está sincronizada
    function subir() {
      if (!nube) return;
      const g = leer();
      nube.F.setDoc(nube.ref, { marcas: g.marcas || {}, extra: g.extra || [] }).catch(() => {});
    }

    document.getElementById("suenos").addEventListener("change", e => {
      const g = leer();
      g.marcas = g.marcas || {};
      g.marcas[e.target.dataset.texto] = e.target.checked;
      guardar(g);
      contar();
      subir();
    });

    document.getElementById("nuevo").addEventListener("submit", e => {
      e.preventDefault();
      const campo = document.getElementById("nuevo-texto");
      const texto = campo.value.trim();
      if (!texto) return;
      const g = leer();
      g.extra = [...(g.extra || []), texto];
      guardar(g);
      campo.value = "";
      pintar();
      subir();
    });

    pintar();

    async function conectarNube() {
      const Nube = await cargarNube();
      Nube.acceso(document.getElementById("acceso"), {
        titulo: "Compartir la lista",
        texto: "Entra y esta lista será la misma para los dos, en cualquier teléfono.",
        alListo: (yo, N) => {
          const { db, F } = N;
          const ref = F.doc(db, "compartido", "suenos");
          let primera = true;
          F.onSnapshot(ref, snap => {
            const local = leer();
            if (primera) {
              primera = false;
              const r = snap.exists() ? snap.data() : {};
              // la primera vez se juntan lo del teléfono y lo de la nube
              const extra = [...new Set([...(r.extra || []), ...(local.extra || [])])];
              const marcas = { ...(local.marcas || {}), ...(r.marcas || {}) };
              guardar({ ...local, extra, marcas });
              nube = { ref, F };
              if (!snap.exists() || extra.length !== (r.extra || []).length || Object.keys(marcas).length !== Object.keys(r.marcas || {}).length) subir();
            } else if (snap.exists() && !snap.metadata.hasPendingWrites) {
              const r = snap.data();
              guardar({ ...local, extra: r.extra || [], marcas: r.marcas || {} });
            }
            pintar();
            document.getElementById("sincro").hidden = false;
            document.getElementById("nota-guardado").textContent = "Esta lista se guarda en la nube y la ven los dos.";
          }, () => {});
        },
        alSalir: () => { if (nube) location.reload(); },
      });
    }
    const detalle = document.getElementById("compartir");
    let conectado = false;
    const conectarUnaVez = () => { if (!conectado) { conectado = true; conectarNube(); } };
    detalle.addEventListener("toggle", () => { if (detalle.open) conectarUnaVez(); });
    try { if (localStorage.getItem("nyl-nube") === "1") { detalle.open = true; conectarUnaVez(); } } catch (e) {}
  </script>
</body>
</html>
