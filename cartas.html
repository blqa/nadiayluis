<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var m=localStorage.getItem("nyl-tema");if(m)document.documentElement.dataset.theme=m}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartas · Nadia y Luis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,0..100,0..1;1,9..144,300..600,0..100,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css?v=20261108e">
  <style>
    .sobres {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
      gap: 4.5rem 2rem;
      padding-top: 1.5rem;
    }

    /* ---------- El sobre ---------- */
    .sobre {
      position: relative;
      aspect-ratio: 3 / 2;
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
      font: inherit;
      color: inherit;
      perspective: 900px;
      transition: transform .25s ease;
    }
    .sobre:hover { transform: translateY(-3px) rotate(-.6deg); }
    .sobre > span { position: absolute; display: block; }

    .sobre-fondo {
      inset: 0;
      background: var(--sobre-fondo);
      border-radius: 6px;
      box-shadow: 0 1px 2px #2b18301f, 0 12px 28px -14px #2b183059;
    }
    .sobre-carta {
      left: 7%; right: 7%; top: 8%; bottom: 8%;
      background: var(--hoja);
      border-radius: 3px;
      z-index: 2;
      transition: transform .5s cubic-bezier(.3,.7,.2,1) .25s;
      background-image: repeating-linear-gradient(to bottom, transparent 0 13px, var(--polvo) 13px 14px);
      background-position: 0 18px;
    }
    .sobre-frente {
      inset: 0;
      z-index: 3;
      border-radius: 6px;
      clip-path: polygon(0 18%, 50% 62%, 100% 18%, 100% 100%, 0 100%);
      background-color: var(--sobre-frente);
    }
    .sobre-solapa {
      left: 0; right: 0; top: 0;
      height: 62%;
      z-index: 4;
      background: var(--sobre-solapa);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform .45s cubic-bezier(.4,0,.2,1), z-index 0s .22s;
      border-radius: 6px 6px 0 0;
    }
    .sello {
      z-index: 5;
      left: 50%; top: 62%;
      width: 2.9rem; height: 2.9rem;
      margin: -1.45rem 0 0 -1.45rem;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #d4436f, var(--cereza) 55%, #8d1a3c);
      color: #fbe3ea;
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.3rem;
      line-height: 2.9rem;
      text-align: center;
      box-shadow: 0 2px 4px #6d10304d, inset 0 -2px 3px #0003;
      transition: opacity .2s, transform .3s;
    }
    .sobre-titulo {
      z-index: 6;
      left: 0; right: 0; bottom: -2.1rem;
      font-family: var(--serif);
      font-size: 1.2rem;
      text-align: center;
      font-variation-settings: "SOFT" 100, "WONK" 1;
    }

    .sobre.abierto .sobre-solapa {
      transform: rotateX(180deg);
      z-index: 1;
    }
    .sobre.abierto .sello { opacity: 0; transform: scale(.6); }
    .sobre.abierto .sobre-carta { transform: translateY(-42%); }

    /* ---------- La carta abierta ---------- */
    dialog.carta {
      border: 0;
      padding: 0;
      background: transparent;
      max-width: min(36rem, calc(100vw - 2rem));
      width: 100%;
      max-height: calc(100svh - 3rem);
      overflow: visible;
      color: var(--tinta);
    }
    dialog.carta::backdrop { background: #2b1830a6; backdrop-filter: blur(3px); }
    dialog.carta[open] .hoja { animation: sacar .45s cubic-bezier(.2,.8,.2,1); }
    @keyframes sacar { from { transform: translateY(40px) rotate(-2deg); opacity: 0; } to { transform: none; opacity: 1; } }
    .hoja {
      background: var(--hoja);
      border-radius: 4px;
      padding: 2.75rem 2rem 2rem;
      max-height: calc(100svh - 3rem);
      overflow-y: auto;
      box-shadow: 0 30px 60px -20px #0006;
      position: relative;
    }
    .hoja h2 {
      font-size: clamp(1.9rem, 6vw, 2.6rem);
      font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 72;
      margin-bottom: 1.25rem;
      padding-right: 2rem;
    }
    .hoja .cuerpo {
      font-family: var(--serif);
      font-size: 1.15rem;
      line-height: 1.7;
      white-space: pre-line;
      font-variation-settings: "SOFT" 100, "opsz" 18;
    }
    .hoja .firma { font-family: var(--serif); font-style: italic; color: var(--cereza); font-size: 1.25rem; margin-top: 1.5rem; text-align: right; }
    .cerrar {
      position: absolute;
      top: .9rem; right: .9rem;
      width: 2.5rem; height: 2.5rem;
      border-radius: 50%;
      border: 0;
      background: var(--papel-2);
      color: var(--tinta);
      cursor: pointer;
      font-size: 1.4rem;
      line-height: 1;
    }
    .cerrar:hover { background: var(--polvo); }

    /* ---------- Poemas ---------- */
    .poemas { padding-top: 7rem; }
    .poemas > h2 { font-size: clamp(2.2rem, 6vw, 3.5rem); font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; }
    .poemas > p { color: var(--tinta-suave); margin-top: .75rem; }
    .poema {
      background: var(--hoja);
      padding: 2.5rem 2rem;
      margin-top: 2.5rem;
      max-width: 40rem;
      box-shadow: 0 1px 2px #2b183014, 0 10px 30px -18px #2b183040;
      border-radius: 3px;
    }
    .poema:nth-of-type(even) { margin-left: auto; }
    .poema time { font-family: var(--serif); font-style: italic; color: var(--cereza); }
    .poema h3 { font-size: 2rem; margin: .25rem 0 1.25rem; font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 72; }
    .poema .cuerpo { font-family: var(--serif); font-size: 1.12rem; line-height: 1.75; white-space: pre-line; font-variation-settings: "SOFT" 100, "opsz" 18; }
    .poema .firma { font-family: var(--serif); font-style: italic; color: var(--cereza); margin-top: 1.25rem; }

    /* ---------- Cartas y confesiones ---------- */
    .confesiones { padding-top: 7rem; }
    .confesiones > h2 { font-size: clamp(2.2rem, 6vw, 3.5rem); font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; }
    .confesiones > p { color: var(--tinta-suave); margin-top: .75rem; max-width: 34rem; }
    .lista-cartas { list-style: none; padding: 0; margin: 2rem 0 0; max-width: 44rem; border-top: 1px solid var(--polvo); }
    .lista-cartas button {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .1rem 1rem;
      align-items: baseline;
      text-align: left;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--polvo);
      padding: 1.1rem 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    .lista-cartas strong { font-family: var(--serif); font-weight: 400; font-size: clamp(1.3rem, 3.5vw, 1.6rem); line-height: 1.2; transition: color .2s; }
    .lista-cartas time { font-family: var(--serif); font-style: italic; color: var(--tinta-suave); font-size: .95rem; white-space: nowrap; }
    .lista-cartas button:hover strong { color: var(--cereza); }
    .hoja .fecha-carta { font-family: var(--serif); font-style: italic; color: var(--cereza); margin: -.75rem 0 1.25rem; }
    .hoja .fecha-carta:empty { display: none; }
    @media (max-width: 520px) {
      .lista-cartas button { grid-template-columns: 1fr; }
    }

    @media (max-width: 760px) {
      .sobres { grid-template-columns: 1fr 1fr; gap: 3rem 1rem; }
      .sobre-titulo { font-size: 1rem; bottom: -2.4rem; }
      .sello { width: 2.3rem; height: 2.3rem; margin: -1.15rem 0 0 -1.15rem; line-height: 2.3rem; font-size: 1.05rem; }
      .hoja { padding: 2.5rem 1.4rem 1.6rem; }
      .poema { padding: 2rem 1.4rem; }
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado-pagina">
      <h1>Abrir cuando…</h1>
      <p>Sobres para los días que los necesites. Escoge uno, el que sea más tú hoy.</p>
    </header>

    <div class="sobres" id="sobres"></div>

    <section class="poemas" aria-labelledby="titulo-poemas">
      <h2 id="titulo-poemas">Poemas</h2>
      <p>Lo que te escribí cuando no me alcanzaban los mensajes.</p>
      <div id="poemas"></div>
    </section>

    <section class="confesiones" aria-labelledby="titulo-confesiones">
      <h2 id="titulo-confesiones">Cartas y confesiones</h2>
      <p>Pensamientos guardados, mensajes de madrugada y palabras que escribí cuando el corazón me dictaba.</p>
      <ul class="lista-cartas" id="lista-cartas"></ul>
    </section>
  </main>

  <dialog class="carta" id="carta" aria-labelledby="carta-titulo">
    <div class="hoja">
      <button class="cerrar" id="cerrar" aria-label="Cerrar carta">×</button>
      <h2 id="carta-titulo"></h2>
      <p class="fecha-carta" id="carta-fecha"></p>
      <div class="cuerpo" id="carta-cuerpo"></div>
      <p class="firma" id="carta-firma">Luis</p>
    </div>
  </dialog>

  <script src="assets/js/datos.js?v=20261108e"></script>
  <script src="assets/js/site.js?v=20261108e"></script>
  <script>
    const contenedor = document.getElementById("sobres");
    contenedor.innerHTML = DATOS.sobres.map((s, i) => `
      <button class="sobre" data-i="${i}" aria-label="Abrir: ${limpio(s.titulo)}">
        <span class="sobre-fondo"></span>
        <span class="sobre-carta"></span>
        <span class="sobre-frente"></span>
        <span class="sobre-solapa"></span>
        <span class="sello" aria-hidden="true">N</span>
        <span class="sobre-titulo">${limpio(s.titulo)}</span>
      </button>`).join("");

    const dialogo = document.getElementById("carta");
    const sinMovimiento = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let sobreAbierto = null;

    contenedor.addEventListener("click", e => {
      const sobre = e.target.closest(".sobre");
      if (!sobre) return;
      const s = DATOS.sobres[sobre.dataset.i];
      sobreAbierto = sobre;
      sobre.classList.add("abierto");
      llenarCarta(s.titulo, s.texto, "");
      setTimeout(() => dialogo.showModal(), sinMovimiento ? 0 : 750);
    });

    function llenarCarta(titulo, texto, fechaTexto) {
      document.getElementById("carta-titulo").textContent = titulo;
      document.getElementById("carta-fecha").textContent = fechaTexto || "";
      document.getElementById("carta-cuerpo").textContent = texto;
      // Si la carta ya termina con la firma, no la repetimos
      document.getElementById("carta-firma").hidden = /luis\s*$/i.test(texto.trim());
    }

    const listaCartas = document.getElementById("lista-cartas");
    listaCartas.innerHTML = DATOS.cartas.map((c, i) => `
      <li><button data-i="${i}">
        <strong>${limpio(c.titulo)}</strong>
        <time>${limpio(c.fecha)}</time>
      </button></li>`).join("");
    listaCartas.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      const c = DATOS.cartas[b.dataset.i];
      sobreAbierto = b;
      llenarCarta(c.titulo, c.texto, c.fecha);
      dialogo.showModal();
    });

    dialogo.addEventListener("close", () => {
      if (sobreAbierto) { sobreAbierto.classList.remove("abierto"); sobreAbierto.focus(); sobreAbierto = null; }
    });
    document.getElementById("cerrar").addEventListener("click", () => dialogo.close());
    dialogo.addEventListener("click", e => { if (e.target === dialogo) dialogo.close(); });

    document.getElementById("poemas").innerHTML = DATOS.poemas.map(p => `
      <article class="poema">
        <time>${limpio(p.fecha)}</time>
        <h3>${limpio(p.titulo)}</h3>
        <div class="cuerpo">${limpio(p.texto)}</div>
        <p class="firma">Luis</p>
      </article>`).join("");
  </script>
</body>
</html>
